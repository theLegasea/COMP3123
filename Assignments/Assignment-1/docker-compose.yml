version: '3.8'
services:
  comp3123-assignment1:
    image: mongo:latest
    container_name: comp3123-assignment1
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodbdata:/data/db

  app:
    build: .
    depends_on:
      - comp3123-assignment1
    environment:
      - DB_URL=mongodb://comp3123-assignment1:27017/comp3123-assignment1
      - PORT=8089
    ports:
      - "8089:8089"
    volumes:
      - .:/usr/src/app
    command: node server.js

volumes:
  mongodbdata: